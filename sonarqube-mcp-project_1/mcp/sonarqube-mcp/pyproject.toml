[project]
name = "sonarqube-mcp"
version = "0.1.0"
description = "Production-ready Model Context Protocol (MCP) server that connects Claude Code to SonarQube / SonarCloud for issue triage, quality-gate checks, and guided fix workflows."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Alqemam Engineering" }]
keywords = ["mcp", "sonarqube", "sonarcloud", "claude", "claude-code", "static-analysis"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Intended Audience :: Developers",
]

dependencies = [
    "mcp[cli]>=2.0.0,<3",
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "tenacity>=8.3,<10",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
sonarqube-mcp = "sonarqube_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sonarqube_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
